name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -E '^ \* Version:' bananaland-consent.php | awk '{print $3}')
          CONST=$(grep -E "define\('BLC_VERSION'" bananaland-consent.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "tag=$TAG header=$HEADER const=$CONST"
          test "$TAG" = "$HEADER" && test "$TAG" = "$CONST"

      - name: Build zip
        run: |
          mkdir -p build/bananaland-consent
          rsync -a --exclude-from=.distignore ./ build/bananaland-consent/ --exclude build
          cd build && zip -qr bananaland-consent.zip bananaland-consent

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk "/^## ${GITHUB_REF_NAME#v}/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" build/bananaland-consent.zip --title "$GITHUB_REF_NAME" --notes "${NOTES:-Release $GITHUB_REF_NAME}"
